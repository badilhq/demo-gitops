apiVersion: badil.dev/v1beta1
gitopsRepoURL: https://github.com/badilhq/demo-gitops.git
services:
  - name: backend-1
    repoURL: https://github.com/badilhq/demo-backend-1.git
    branch: main
    commitSha: 2ce489084f1cbef12d5ab45555e033964b0cea09
    imageTag: sha-2ce4890
    chart:
      path: deploy/helm
      imageTagParam: svc.image.tag
      hostParam: svc.ingress.host
      valueFiles:
        - values-preview.yaml
    host: backend-1-feature-items-count.127.0.0.1.nip.io
    metadata:
      pr-author: amine7536
      pr-url: https://github.com/badilhq/demo-backend-1/pull/41
      pr-number: "41"
      created-at: "2026-11-16T16:23:33Z"
      updated-at: "2026-11-16T16:23:33Z"
      vcs.ref.name: feature/items-count
      cicd.pipeline.run.url: ""
  - name: backend-2
    repoURL: https://github.com/badilhq/demo-backend-2.git
    branch: main
    imageTag: sha-${ARGOCD_APP_REVISION_SHORT}
    chart:
      path: k8s/
      imageTagParam: app.image.tag
      hostParam: app.ingress.host
    host: backend-2-feature-items-count.127.0.0.1.nip.io
  - name: front
    repoURL: https://github.com/badilhq/demo-front.git
    branch: main
    imageTag: sha-${ARGOCD_APP_REVISION_SHORT}
    chart:
      path: k8s/
      imageTagParam: app.image.tag
      hostParam: app.ingress.host
    host: front-feature-items-count.127.0.0.1.nip.io
  - name: postgres
    repoURL: https://github.com/badilhq/demo-postgres.git
    branch: main
    imageTag: sha-${ARGOCD_APP_REVISION_SHORT}
    chart:
      path: k8s/
      imageTagParam: app.image.tag
      hostParam: app.ingress.host
dependencies:
  - name: podinfo
    chart:
      repoURL: oci://ghcr.io/stefanprodan/charts/podinfo
      version: 6.17.0
    valueFiles:
      - deps/podinfo.yaml
  - name: mailpit
    chart:
      repoURL: https://jouve.github.io/charts
      name: mailpit
      version: 0.39.0
    values:
      ingress:
        enabled: true
    hostParam: ingress.hostname
    host: mailpit-feature-items-count.127.0.0.1.nip.io
