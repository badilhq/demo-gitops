services:
  backend-1:
    repo: "https://github.com/badilhq/demo-backend-1.git"
  backend-2:
    repo: "https://github.com/badilhq/demo-backend-2.git"
  front:
    repo: "https://github.com/badilhq/demo-front.git"
  postgres:
    repo: "https://github.com/badilhq/demo-postgres.git"
  mono-api:
    repo: "https://github.com/badilhq/demo-monorepo.git"
    chart:
      path: api/chart
    paths: ["api/**"]
  mono-web:
    repo: "https://github.com/badilhq/demo-monorepo.git"
    chart:
      path: web/chart
    paths: ["web/**"]
preview:
  domain: 127.0.0.1.nip.io
  tls: false
  expose:
    front: {}
    backend-1: {}
    backend-2: {}
    mono-api: {}
    mono-web: {}
    podinfo: {}
dependencies:
  podinfo:
    chart: oci://ghcr.io/stefanprodan/charts/podinfo
    version: 6.17.0
    valueFiles:
      - e2e/podinfo-ingress.yaml
    hostParam: ingress.hosts[0].host
